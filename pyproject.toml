[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-sync-warehouse"
version = "0.1.0"
description = "An explainable synthetic mock CRM reporting pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "psycopg[binary]>=3.2,<4", "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["mock_crm*", "pipeline*", "warehouse*", "quality*"]

[tool.setuptools.package-data]
warehouse = ["*.sql", "models/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires the CI PostgreSQL and TimescaleDB service"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
